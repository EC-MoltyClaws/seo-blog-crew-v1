name: Blog Topic Queue
description: Add a new topic to the blog queue.
title: "[Blog Topic]: "
labels: ["blog-queue"]
body:
  - type: textarea
    id: json_payload
    attributes:
      label: JSON Payload
      description: Provide the blog queue item as valid JSON.
      placeholder: |
        {
          "title": "...",
          "topic": "...",
          "category": "...",
          "target_audience": "...",
          "shopify_hosted_image_link": "...",
          "utm_product_url": "..."
        }
      render: json
    validations:
      required: true
